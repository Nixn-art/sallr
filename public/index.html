<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>SaulR — Considered clothing</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"/></head>
<link rel="stylesheet" href="auth.css"/><link rel="stylesheet" href="seller.css"/><link rel="stylesheet" href="buyer.css"/><link rel="stylesheet" href="notifications.css"/><body>
<header class="topbar"><button class="ghost fav" onclick="openFavorites()"><svg><use href="#heart"/></svg><span>Favorites</span></button><a class="wordmark" href="#top">SaulR</a><button class="icon-btn" onclick="document.querySelector('#searchInput').focus()"><svg><use href="#search"/></svg></button></header>
<main id="top"><section class="search-wrap"><svg><use href="#search"/></svg><input id="searchInput" placeholder="Search pieces, brands, categories" autocomplete="off" oninput="renderListings()"/><button class="filter-btn" onclick="toggleFilters()"><svg><use href="#filter"/></svg></button><div id="filters" class="filters"><label>Min price <input id="minPrice" type="number" placeholder="0"/></label><label>Max price <input id="maxPrice" type="number" placeholder="Any"/></label><button onclick="renderListings()">Apply</button></div></section>
<section class="hero"><img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=1800&q=85" alt="Shirts on a rail"/><div class="hero-shade"></div><div class="hero-copy"><p>THE DAILY EDIT</p><h1>Pieces worth<br/>holding on to.</h1><button onclick="document.querySelector('#all-listings').scrollIntoView({behavior:'smooth'})">Shop now <span>→</span></button></div><small>01 — 24</small></section>
<section class="categories" id="categories"></section>
<section class="section-head"><div><p>JUST IN</p><h2>New arrivals</h2></div><button onclick="scrollNew(1)">View all <span>↗</span></button></section><section class="new-rail" id="newRail"></section>
<section id="all-listings" class="section-head all-head"><div><p>MARKETPLACE</p><h2>All listings</h2></div><span id="count"></span></section><section class="listing-grid" id="listingGrid"></section>
</main>
<nav><button class="active" onclick="location.hash='top';window.scrollTo({top:0,behavior:'smooth'})"><svg><use href="#home"/></svg></button><button id="messagesButton" onclick="openPanel('messages')"><svg><use href="#message"/></svg></button><button onclick="openPanel('profile')"><svg><use href="#user"/></svg></button></nav>
<div class="modal" id="modal"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div><div class="backdrop" id="backdrop" onclick="closeModal()"></div>
<svg class="defs"><symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8Z"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol><symbol id="filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol><symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-6h6v6"/></symbol><symbol id="message" viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/></symbol><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"/></symbol></svg>
<script src="app.js"></script></body></html>
